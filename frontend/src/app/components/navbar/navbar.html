<header class="app-navbar">
  <div class="navbar-container">

    <div class="navbar-left">
      <button (click)="onToggle()" class="hamburger-btn" aria-label="Toggle navigation">
        ☰
      </button>

      <a routerLink="/dashboard" class="brand-logo">
        <span class="logo-text">TaskFlow</span>
      </a>
    </div>

    @if (isLoggedIn) {
      <nav class="navbar-nav">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
          Dashboard
        </a>
        <a routerLink="/tasks" routerLinkActive="active" class="nav-link">
          {{ isManager ? 'Assigned Tasks' : 'My Tasks' }}
        </a>

        @if (isManager) {
          <a routerLink="/interns" routerLinkActive="active" class="nav-link">
            Interns List
          </a>
          <a routerLink="/create-intern" routerLinkActive="active" class="nav-link">
            Create New Interns
          </a>
          <a routerLink="/create-task" routerLinkActive="active" class="nav-link">
            Assign Task
          </a>
        }
      </nav>

      <div class="navbar-right">
        <span class="navbar-user">
          {{ userName || 'User' }}
        </span>
        <button (click)="logout()" class="logout-btn">
          Logout
        </button>
      </div>
    }

  </div>
</header>
